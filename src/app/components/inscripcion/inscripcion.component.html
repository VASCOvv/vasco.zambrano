<div class="container">
  <div class="card">
    <h2>Formulario de Inscripción</h2>
    <p>Ingresa tus datos para inscribirte en un taller:</p>

    <div *ngIf="mensajeExito" class="alert-success">
      Inscripción guardada correctamente.
    </div>

    <form [formGroup]="formularioInscripcion" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Nombre Completo:</label>
        <input 
          type="text" 
          formControlName="nombreEstudiante"
          [class.invalid]="esCampoInvalido('nombreEstudiante')"
        >
        <div *ngIf="esCampoInvalido('nombreEstudiante')" class="error-text">
          El nombre es obligatorio (mínimo 3 caracteres).
        </div>
      </div>

      <div class="form-group">
        <label>RUT:</label>
        <input 
          type="text" 
          formControlName="rut"
          [class.invalid]="esCampoInvalido('rut')"
        >
        <div *ngIf="esCampoInvalido('rut')" class="error-text">
          El RUT es obligatorio.
        </div>
      </div>

      <div class="form-group">
        <label>Correo Electrónico:</label>
        <input 
          type="email" 
          formControlName="email"
          [class.invalid]="esCampoInvalido('email')"
        >
        <div *ngIf="esCampoInvalido('email')" class="error-text">
          Ingrese un correo electrónico válido.
        </div>
      </div>

      <div class="form-group">
        <label>Carrera:</label>
        <input 
          type="text" 
          formControlName="carrera"
          [class.invalid]="esCampoInvalido('carrera')"
        >
        <div *ngIf="esCampoInvalido('carrera')" class="error-text">
          La carrera es obligatoria.
        </div>
      </div>

      <div class="form-group">
        <label>Seleccionar Taller:</label>
        <select 
          formControlName="actividadId"
          [class.invalid]="esCampoInvalido('actividadId')"
        >
          <option value="" disabled selected>-- Seleccionar --</option>
          <option *ngFor="let act of actividades" [value]="act.id">
            {{ act.nombre }} ({{ act.horario }})
          </option>
        </select>
        <div *ngIf="esCampoInvalido('actividadId')" class="error-text">
          Debe seleccionar un taller.
        </div>
      </div>

      <button type="submit" [disabled]="formularioInscripcion.invalid" class="btn btn-primary">
        Enviar Inscripción
      </button>
    </form>
  </div>
</div>
