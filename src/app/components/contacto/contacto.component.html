<div class="container">
  <div class="card">
    <h2>Contacto</h2>
    <p>Información de contacto institucional:</p>

    <p><strong>Dirección:</strong> {{ direccion }}</p>
    <p><strong>Teléfono:</strong> {{ telefono }}</p>
    <p><strong>Correo Electrónico:</strong> {{ email }}</p>
  </div>

  <div class="card">
    <h3>Horario de Atención</h3>
    <table>
      <thead>
        <tr>
          <th>Día</th>
          <th>Horario</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Lunes a Jueves</td>
          <td>08:30 a 18:00 hrs</td>
        </tr>
        <tr>
          <td>Viernes</td>
          <td>08:30 a 16:30 hrs</td>
        </tr>
        <tr>
          <td>Sábados y Domingos</td>
          <td>Cerrado</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
